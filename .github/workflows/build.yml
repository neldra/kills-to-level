name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin hub packages plugins on JDK 11, so build there too rather than
        # relying on options.release alone; 21 catches anything a newer toolchain breaks.
        java: ['11', '21']

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Gradle names each test as it runs and prints the tally at the end. `build` also runs
      # checkstyle over every source set, against the client's own config.
      - name: Build and test
        run: ./gradlew build --stacktrace

      # Both test source sets, plus checkstyle, so a red build can be read without reproducing it.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-java-${{ matrix.java }}
          path: |
            build/reports/tests/test
            build/reports/tests/pluginTest
            build/reports/checkstyle
          if-no-files-found: ignore
