<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 270" width="870" height="270" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <style>
      .box  { fill: #21262d; stroke: #444c56; stroke-width: 1.5; }
      .dec  { fill: #2b2517; stroke: #9e6a03; stroke-width: 1.5; }
      .out  { fill: #1a7f37; stroke: #2ea043; stroke-width: 1.5; }
      .t    { fill: #e6edf3; font-size: 15px; }
      .lbl  { fill: #8b949e; font-size: 13px; }
      .conn { stroke: #8b949e; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- row 1 -->
  <rect class="box" x="30"  y="50" width="150" height="46" rx="8"/>
  <text class="t" x="105" y="79" text-anchor="middle">You hit an NPC</text>

  <rect class="box" x="215" y="50" width="175" height="46" rx="8"/>
  <text class="t" x="302" y="79" text-anchor="middle">Remember the tick</text>

  <path class="dec" d="M 500 33 L 575 73 L 500 113 L 425 73 Z"/>
  <text class="t" x="500" y="79" text-anchor="middle">NPC dies?</text>

  <rect class="box" x="610" y="50" width="230" height="46" rx="8"/>
  <text class="t" x="725" y="79" text-anchor="middle">XP at the killing blow</text>

  <!-- row 2 -->
  <rect class="box" x="30"  y="200" width="230" height="46" rx="8"/>
  <text class="t" x="145" y="229" text-anchor="middle">Window of last N kills</text>

  <rect class="box" x="295" y="200" width="150" height="46" rx="8"/>
  <text class="t" x="370" y="229" text-anchor="middle">XP per kill</text>

  <rect class="out" x="480" y="200" width="210" height="46" rx="8"/>
  <text class="t" x="585" y="229" text-anchor="middle">Kills to next level</text>

  <!-- connectors -->
  <line class="conn" x1="180" y1="73" x2="209" y2="73"/>
  <line class="conn" x1="390" y1="73" x2="419" y2="73"/>
  <line class="conn" x1="575" y1="73" x2="604" y2="73"/>
  <text class="lbl" x="592" y="63" text-anchor="middle">yes</text>

  <!-- "no" loops back to the start -->
  <path class="conn" d="M 500 33 L 500 16 L 105 16 L 105 44"/>
  <text class="lbl" x="302" y="10" text-anchor="middle">no</text>

  <!-- row 1 into row 2 -->
  <path class="conn" d="M 725 96 L 725 148 L 145 148 L 145 194"/>

  <line class="conn" x1="260" y1="223" x2="289" y2="223"/>
  <line class="conn" x1="445" y1="223" x2="474" y2="223"/>
</svg>
